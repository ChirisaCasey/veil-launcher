name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Builds the UI (beforeBuildCommand), the app and the NSIS installer,
      # then uploads them to a draft GitHub release.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag pushes use the tag; manual runs fall back to v<version from tauri.conf.json>.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Veil Launcher ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            ## Install

            Download **`Veil.Launcher_*_x64-setup.exe`** below and run it.

            Windows 10/11 (64-bit). WebView2 is installed automatically if missing.

            > These builds are not code-signed yet. If SmartScreen shows "Windows protected your PC", click **More info** → **Run anyway**.

            Updating: just run the new installer. Uninstalling restores the original VALORANT menu video.

            Not affiliated with or endorsed by Riot Games.
          releaseDraft: true
          prerelease: false
